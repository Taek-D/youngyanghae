existing_patterns:
  - 3-layer premium 아키텍처 (types/premium.ts → storage/premiumRepository.ts → services/iapService.ts → hooks/usePremium.ts → contexts/PremiumContext.tsx)
  - IndexedDB 영속화 (해지해는 idb 사용) — 영양제 앱도 동일
  - TDS adaptiveFloatBackground #FFFFFF 선언 (Dialog 투명 버그 방지)
  - Dynamic import + isSupported 체크 (SDK 안전 호출)
  - 환불 감지 폴링 (getCompletedOrRefundedOrders) → 프리미엄 해제
  - 미결 주문 앱 시작 시 자동 복원
  - 한글 임팩트 브랜딩 + 모노톤 네비게이션 아이콘
  - 무료 게이팅 상수 관리 (premiumConstants.ts)

